<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" rx="16"/>
  <rect width="800" height="400" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.15" rx="16"/>
  
  <!-- Icon -->
  <text x="400" y="160" text-anchor="middle" font-size="80" fill="#0ea5e9" opacity="0.3">🌊</text>
  
  <!-- Product Name -->
  <text x="400" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#1a1a2e">Polarized Sunglasses</text>
  
  <!-- Description -->
  <text x="400" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6b7280">Premium Polarized Sunglasses Glare-Free</text>
  
  <!-- Subtle accent line -->
  <line x1="340" y1="310" x2="460" y2="310" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Brand -->
  <text x="400" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af" letter-spacing="2">EYEVIEW SUNGLASSES — MANUFACTURER</text>
</svg>