<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle pattern -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1100" cy="530" r="300" fill="rgba(255,255,255,0.03)"/>

  <!-- Sunglasses icon (centered, large) -->
  <g transform="translate(350, 140) scale(3.5)">
    <!-- Left lens -->
    <rect x="4" y="22" width="56" height="36" rx="10" ry="10" fill="url(#lensGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <!-- Right lens -->
    <rect x="80" y="22" width="56" height="36" rx="10" ry="10" fill="url(#lensGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <!-- Bridge -->
    <path d="M60 34 Q70 26 80 34" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <!-- Lens shine -->
    <rect x="12" y="28" width="14" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
    <rect x="88" y="28" width="14" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="white">EyeView Sunglasses</text>

  <!-- Tagline -->
  <text x="600" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="rgba(255,255,255,0.8)">Wholesale Sunglasses Manufacturer | OEM &amp; ODM</text>

  <!-- Website -->
  <text x="600" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)">eyeviewsunglasses.com</text>
</svg>
