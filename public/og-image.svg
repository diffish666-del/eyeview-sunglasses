<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Icon -->
  <g transform="translate(600, 140)">
    <text text-anchor="middle" font-size="72">🕶️</text>
  </g>

  <!-- Main heading -->
  <text x="600" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    EyeView Sunglasses
  </text>

  <!-- Subtitle -->
  <text x="600" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#c0c8d8" text-anchor="middle" letter-spacing="1">
    Wholesale OEM Custom Sunglasses Manufacturer
  </text>

  <!-- Stats -->
  <text x="600" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8899aa" text-anchor="middle">
    15+ Years Experience  •  500+ Global Clients  •  1M+ Pairs Produced
  </text>

  <!-- Divider -->
  <line x1="400" y1="400" x2="800" y2="400" stroke="#ffd700" stroke-width="1" opacity="0.3"/>

  <!-- URL -->
  <text x="600" y="460" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle" letter-spacing="3">
    eyeviewsunglasses.com
  </text>

  <!-- Bottom accent bar -->
  <rect y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
